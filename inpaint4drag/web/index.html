<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DragEdit</title>
  <link rel="stylesheet" href="style.css?v=inpaint-provider-7">
</head>
<body>
  <header class="app-header">
    <div>
      <div class="eyebrow">DRAG-BASED IMAGE EDITING</div>
      <h1>DragEdit</h1>
    </div>
    <p id="instructions">请先加载图像。</p>
  </header>

  <main id="workspace">
    <div id="stagesArea" class="stage-grid">
      <article class="viewer-card">
        <header class="viewer-title">
          <span>Mask 与拖拽编辑</span>
            <span class="viewer-badge">可视区</span>
        </header>
        <div id="editorViewport" class="viewer-body">
          <div id="emptyState" class="empty-state">
            <strong>选择一张图像开始</strong>
            <span>在左侧操作台完成 Mask、拖拽和局部重绘。</span>
          </div>
          <div id="stage" class="image-stage" hidden>
            <canvas id="previewCanvas"></canvas>
            <canvas id="overlayCanvas"></canvas>
          </div>
        </div>
      </article>

      <article class="viewer-card">
        <header class="viewer-title">
          <span>原图 / 生成图</span>
          <span class="viewer-badge">可视区</span>
        </header>
        <div id="comparisonViewport" class="viewer-body">
          <div id="comparisonEmpty" class="empty-state">
            <strong>等待生成结果</strong>
            <span>生成后拖动竖线查看原图与重绘结果。</span>
          </div>
          <div id="comparisonStage" class="comparison-stage" hidden>
            <canvas id="generatedCanvas"></canvas>
            <canvas id="originalCanvas"></canvas>
            <div id="comparisonDivider" class="comparison-divider">
              <span class="divider-handle">↔</span>
            </div>
          </div>
        </div>
        <div id="pipelineInputs" class="pipeline-inputs" hidden>
          <figure>
            <button class="pipeline-thumbnail" type="button" data-pipeline-input="image"
                    aria-label="以原始分辨率查看 Pipeline image 输入">
              <img id="debugImageInput" alt="Pipeline image input">
            </button>
            <figcaption><code>image</code><span id="debugImageInputSize"></span></figcaption>
          </figure>
          <figure>
            <button class="pipeline-thumbnail" type="button" data-pipeline-input="image_reference"
                    aria-label="以原始分辨率查看 Pipeline image_reference 输入">
              <img id="debugImageReference" alt="Pipeline image reference input">
            </button>
            <figcaption><code>image_reference</code><span id="debugImageReferenceSize"></span></figcaption>
          </figure>
          <figure>
            <button class="pipeline-thumbnail" type="button" data-pipeline-input="mask_image"
                    aria-label="以原始分辨率查看 Pipeline mask_image 输入">
              <img id="debugMaskImage" alt="Pipeline mask image input">
            </button>
            <figcaption><code>mask_image</code><span id="debugMaskImageSize"></span></figcaption>
          </figure>
        </div>
      </article>
    </div>

    <footer id="footer">
      <span id="status">等待图像</span>
      <span id="performance"></span>
    </footer>
  </main>

  <aside class="toolbar">
    <header class="toolbar-title">
      <strong>编辑操作台</strong>
      <span>图像、Mask、拖拽与生成</span>
    </header>
    <section class="tool-group image-mask-tools">
      <h2><span>1</span> 图像与 Mask</h2>
      <div class="control-row">
        <label class="file-button">
          选择图像
          <input id="imageInput" type="file" accept="image/*">
        </label>
        <label class="number-row">
          <span>预览长边</span>
          <input id="previewLongEdge" type="number" min="320" max="4096" step="1" value="1080">
          <span>px</span>
        </label>
      </div>
      <div class="button-grid mask-tools">
        <button data-mode="paint" class="mode-button">手动画笔</button>
        <button data-mode="erase" class="mode-button">橡皮</button>
        <button data-mode="sam" class="mode-button" disabled>SAM 点选</button>
        <button id="clearMask">清空 Mask</button>
      </div>
      <label class="range-row">
        <span>画笔大小</span>
        <input id="brushSize" type="range" min="4" max="100" value="32">
      </label>
      <p id="samHint" class="section-hint">加载图像后检查 SAM 状态。</p>
    </section>

    <section class="tool-group edit-tools">
      <h2><span>2</span> 拖拽编辑</h2>
      <div class="button-grid edit-tabs">
        <button data-mode="transform" class="mode-button">二维整体变换</button>
        <button data-mode="deform" class="mode-button">二维非刚形变</button>
      </div>
      <label class="select-row">
        <span>Warp 算法</span>
        <select id="warpAlgorithm">
          <option value="baseline">Baseline Warp（bi_warp）</option>
          <option value="my_warp">My Warp（实验版本）</option>
        </select>
      </label>
      <label id="boundaryAnchorRow" class="check-row" hidden>
        <input id="boundaryAnchors" type="checkbox" checked>
        <span>自动固定远端边界</span>
      </label>
      <label class="range-row">
        <span>Warp 透明度</span>
        <input id="warpOpacity" type="range" min="0" max="100" value="100">
        <output id="warpOpacityValue">100%</output>
      </label>
      <label class="range-row">
        <span>空洞扩张</span>
        <input id="inpaintKernelSize" type="range" min="1" max="31" step="2" value="5">
        <output id="inpaintKernelSizeValue">5 px</output>
      </label>
      <div class="button-grid">
        <button id="deletePair">删除选中点对</button>
        <button id="resetEdit">重置编辑</button>
      </div>
    </section>

    <section class="tool-group generation-tools">
      <h2><span>3</span> 生成重绘</h2>
      <label class="prompt-row">
        <span>提示词</span>
        <textarea id="generationPrompt" rows="4" placeholder="SD1.5 Inpainting 默认使用空提示词"></textarea>
      </label>
      <div class="generation-parameters">
        <label><span>Steps</span><input id="generationSteps" type="number" min="1" max="50" value="8"></label>
        <label><span>Strength</span><input id="generationStrength" type="number" min="0" max="1" step="0.05" value="1"></label>
        <label><span>Guidance</span><input id="generationGuidance" type="number" min="0" max="20" step="0.1" value="1"></label>
        <label><span>Seed</span><input id="generationSeed" type="number" min="0" step="1" value="0"></label>
      </div>
      <button id="generateImage" class="primary-button">生成图片</button>
      <div id="generationProgress" class="generation-progress" hidden>
        <progress id="generationProgressBar" max="100" value="0"></progress>
        <div>
          <span id="generationProgressStage">准备生成</span>
          <output id="generationProgressValue">0%</output>
        </div>
      </div>
      <p id="generationHint" class="section-hint">生成模型会在服务启动时加载。</p>
    </section>
  </aside>

  <dialog id="pipelineInputDialog" class="pipeline-input-dialog"
          aria-labelledby="pipelineInputDialogTitle">
    <div class="pipeline-dialog-shell">
      <header>
        <strong id="pipelineInputDialogTitle"></strong>
        <span id="pipelineInputDialogSize"></span>
        <button id="closePipelineInputDialog" type="button" aria-label="关闭原图查看">×</button>
      </header>
      <div class="full-image-scroll">
        <img id="pipelineInputFullImage" alt="Pipeline 原始分辨率输入">
      </div>
    </div>
  </dialog>

  <script type="module" src="app.js?v=inpaint-provider-7"></script>
</body>
</html>
